<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGV6 Public Chat</title>
    <link rel="stylesheet" href="chat.css">
    <link rel="stylesheet" href="public-chat.css">
</head>
<body hidden>
    <main class="chat-shell">
        <header class="chat-header">
            <div>
                <p class="eyebrow">Open community</p>
                <h1>Public Chat</h1>
                <p class="subtitle">A shared room for everyone in the GGV6 arcade.</p>
            </div>
            <a class="back-link" href="index.html">Back to arcade</a>
        </header>

        <section class="chat-panel" aria-label="Public chat">
            <div class="connection" id="connection">Connecting...</div>
            <div class="messages" id="messages" aria-live="polite"></div>
            <form class="message-form" id="message-form">
                <label class="sr-only" for="message">Message</label>
                <input id="message" name="message" maxlength="500" placeholder="Say something to the arcade..." autocomplete="off" required>
                <button type="submit" id="send-button">Send</button>
            </form>
            <p class="status" id="status" role="status" aria-live="polite"></p>
        </section>
    </main>
    <script src="public-chat.js"></script>
</body>
</html>
