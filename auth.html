<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGV6 Account</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <main class="auth-shell">
        <a class="back-link" href="index.html">&larr; Back to arcade</a>
        <section class="auth-panel">
            <p class="eyebrow">GGV6 Access</p>
            <h1>Enter the grid.</h1>
            <p class="subtitle">Create an account or log in to keep your arcade identity.</p>

            <div class="tabs" role="tablist" aria-label="Account actions">
                <button class="tab active" type="button" data-mode="login">Log in</button>
                <button class="tab" type="button" data-mode="signup">Sign up</button>
            </div>

            <form id="auth-form">
                <label for="username">Username</label>
                <input id="username" name="username" autocomplete="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" required>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" minlength="4" required>
                <button class="submit-btn" type="submit" id="submit-button">Log in</button>
            </form>
            <p class="status" id="status" role="status" aria-live="polite"></p>
        </section>
    </main>
    <script src="auth.js"></script>
</body>
</html>
